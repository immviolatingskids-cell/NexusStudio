[project]
name = "nexus-studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6>=6.8"]
gemini = ["google-genai>=1.0"]
package = ["pyinstaller>=6.0"]

[project.scripts]
characterstudio = "desktop:main"

[tool.setuptools]
packages = ["engine", "pools", "styles"]
py-modules = ["config", "desktop", "generate", "pool_models", "studio"]

[tool.pytest.ini_options]
testpaths = ["test"]
